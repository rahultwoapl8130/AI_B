services:
  - type: web
    name: techmart-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROJECT_NAME
        value: "TechMart AI Support"
      - key: SECRET_KEY
        generateValue: true
